name: providentia
description: Multi-platform household stock control application.
publish_to: none
version: 1.0.0+10

environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: '>=3.44.7 <4.0.0'

dependencies:
  camera: 0.12.0+2
  camera_desktop: 1.2.1
  crypto: 3.0.7
  drift: 2.34.3
  drift_flutter: 0.3.1
  excel_plus: 2.15.0
  file_picker: 11.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 10.3.1
  http: 1.5.0
  http_parser: 4.1.2
  image: 4.9.1
  image_picker: 1.2.3
  intl: 0.20.2
  path_provider: 2.1.6
  pdfrx: 2.4.7
  providentia_api_client:
    path: contracts/generated/providentia_api_client
  sqlite3: 3.5.0
  web: 1.1.1

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.5
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  # path_provider_android 2.3.x uses Android JNI native assets. Flutter's
  # platform package graph otherwise carries libdartjni into Linux bundles,
  # despite the homeowner client having no Linux JNI runtime edge.
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true
