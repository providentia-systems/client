name: Dependency lock refresh

on:
  pull_request:
    paths:
      - .gitignore
      - pubspec.yaml
      - pubspec.lock
      - android/app/build.gradle.kts
      - android/build.gradle.kts
      - android/settings.gradle.kts
      - android/gradle/wrapper/gradle-wrapper.properties
      - .github/workflows/bootstrap-lockfile.yml
  push:
    branches:
      - main
      - 'agent/**'
      - 'feature/**'
      - 'phase-*/**'
    paths:
      - .gitignore
      - pubspec.yaml
      - pubspec.lock
      - android/app/build.gradle.kts
      - android/build.gradle.kts
      - android/settings.gradle.kts
      - android/gradle/wrapper/gradle-wrapper.properties
      - .github/workflows/bootstrap-lockfile.yml

permissions:
  contents: write

concurrency:
  group: providentia-flutter-lock-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  create-lockfile:
    name: Refresh dependency locks
    if: >-
      github.repository == 'providentia-systems/client' &&
      (github.event_name == 'pull_request' ||
      !contains(github.event.head_commit.message, '[lockfile-bootstrap]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Install pinned Flutter SDK
        run: |
          tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve the dependency graph
        run: flutter pub get

      - name: Refresh Android dependency locks
        working-directory: android
        run: ./gradlew :generateLockfiles

      - name: Verify mutation scope
        id: mutation
        run: |
          mapfile -t changed < <(git status --porcelain | sed 's/^...//')
          for path in "${changed[@]}"; do
            case "$path" in
              pubspec.lock|android/buildscript-gradle.lockfile|android/project-*.lockfile)
                ;;
              *)
                echo "Unexpected generated path: $path" >&2
                exit 1
                ;;
            esac
          done
          if [[ ${#changed[@]} -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit only dependency locks
        if: steps.mutation.outputs.changed == 'true'
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pubspec.lock android/buildscript-gradle.lockfile android/project-*.lockfile
          mapfile -t staged < <(git diff --cached --name-only)
          for path in "${staged[@]}"; do
            case "$path" in
              pubspec.lock|android/buildscript-gradle.lockfile|android/project-*.lockfile)
                ;;
              *)
                echo "Unexpected staged path: $path" >&2
                exit 1
                ;;
            esac
          done
          git commit -m '[lockfile-bootstrap] Refresh Flutter and Android dependency graphs'
          git push origin "HEAD:${TARGET_BRANCH}"
