name: Prepare reviewed Step 1 edits

on:
  pull_request:
    paths:
      - .step1-sync.patch
      - .github/workflows/step-1-prepare.yml

permissions:
  contents: write

jobs:
  prepare:
    if: >-
      github.repository == 'providentia-systems/client' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/step-1-authoritative-sync'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply the reviewed source diff
        run: |
          git apply --check .step1-sync.patch
          git apply --index .step1-sync.patch
      - name: Install repository-pinned formatter
        run: |
          tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - name: Format only the five changed Dart files
        run: |
          dart format \
            lib/app/production_bootstrap_app.dart \
            lib/core/networking/session_http_client.dart \
            lib/core/synchronization/session_bound_sync_gateway.dart \
            test/core/synchronization/session_bound_sync_gateway_test.dart \
            test/integration/api11_onboarding_adapters_test.dart
          git diff --check
      - name: Commit the source edits to this repair branch only
        env:
          TARGET_BRANCH: fix/step-1-authoritative-sync
        run: |
          git add -- lib/app/production_bootstrap_app.dart \
            lib/core/networking/session_http_client.dart \
            lib/core/synchronization/session_bound_sync_gateway.dart \
            test/core/synchronization/session_bound_sync_gateway_test.dart \
            test/integration/api11_onboarding_adapters_test.dart
          git rm -- .step1-sync.patch
          while IFS= read -r path; do
            case "$path" in
              lib/app/production_bootstrap_app.dart|lib/core/networking/session_http_client.dart|lib/core/synchronization/session_bound_sync_gateway.dart|test/core/synchronization/session_bound_sync_gateway_test.dart|test/integration/api11_onboarding_adapters_test.dart|.step1-sync.patch) ;;
              *) echo "Unexpected mutation: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(sync): bind production workspaces and fence late session traffic'
          git push origin "HEAD:${TARGET_BRANCH}"
