name: Browser persistence and authentication acceptance

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: HTTPS URL of the deployed Providentia PWA
        required: true
        type: string
      require_auth:
        description: Require protected end-to-end cookie authentication
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: browser-acceptance-${{ inputs.target_url }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    environment: production-acceptance
    env:
      TARGET_URL: ${{ inputs.target_url }}
      REQUIRE_AUTH: ${{ inputs.require_auth }}
      API_URL: ${{ vars.E2E_API_BASE_URL || secrets.E2E_API_BASE_URL }}
      HOMEOWNER_APP_LINK_BASE: ${{ vars.E2E_HOMEOWNER_APP_LINK_BASE }}
      EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      IMAP_HOST: ${{ vars.E2E_MAILBOX_IMAP_HOST }}
      IMAP_PORT: ${{ vars.E2E_MAILBOX_IMAP_PORT || '993' }}
      IMAP_SECURE: ${{ vars.E2E_MAILBOX_IMAP_SECURE || 'true' }}
      IMAP_USER: ${{ secrets.E2E_MAILBOX_IMAP_USER }}
      IMAP_PASSWORD: ${{ secrets.E2E_MAILBOX_IMAP_PASSWORD }}
    steps:
      - run: |
          [[ "$TARGET_URL" == https://* ]] || { echo 'A deployed HTTPS PWA URL is required.' >&2; exit 78; }
          if [[ "$REQUIRE_AUTH" == true ]]; then
            [[ "$API_URL" == https://* && "$HOMEOWNER_APP_LINK_BASE" == https://* && -n "$EMAIL" && -n "$IMAP_HOST" && -n "$IMAP_USER" && -n "$IMAP_PASSWORD" ]] || {
              echo 'Authenticated acceptance requires HTTPS API/homeowner app-link URLs, a synthetic email and controlled IMAP mailbox settings.' >&2
              exit 78
            }
            [[ "$IMAP_PORT" =~ ^[0-9]+$ && "$IMAP_PORT" -ge 1 && "$IMAP_PORT" -le 65535 && "$IMAP_SECURE" == true ]] || {
              echo 'Authenticated acceptance requires a valid E2E_MAILBOX_IMAP_PORT and TLS-secured IMAP.' >&2
              exit 78
            }
          fi

  browser-matrix:
    needs: preflight
    runs-on: ubuntu-24.04
    environment: production-acceptance
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            authenticate: true
          - browser: firefox
            authenticate: false
          - browser: webkit
            authenticate: false
          - browser: edge
            authenticate: false
    env:
      # Keep workflow retries inside the backend's five-attempt per-address
      # window: Chrome proves authentication; every engine proves PWA behavior.
      TARGET_URL: ${{ inputs.target_url }}
      BROWSER: ${{ matrix.browser }}
      EVIDENCE_PATH: build/release/browser-evidence/${{ matrix.browser }}.json
      E2E_REQUIRE_AUTH: ${{ inputs.require_auth && matrix.authenticate && '1' || '0' }}
      E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL || secrets.E2E_API_BASE_URL }}
      E2E_HOMEOWNER_APP_LINK_BASE: ${{ vars.E2E_HOMEOWNER_APP_LINK_BASE }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_MAILBOX_IMAP_HOST: ${{ vars.E2E_MAILBOX_IMAP_HOST }}
      E2E_MAILBOX_IMAP_PORT: ${{ vars.E2E_MAILBOX_IMAP_PORT || '993' }}
      E2E_MAILBOX_IMAP_SECURE: ${{ vars.E2E_MAILBOX_IMAP_SECURE || 'true' }}
      E2E_MAILBOX_IMAP_FOLDER: ${{ vars.E2E_MAILBOX_IMAP_FOLDER || 'INBOX' }}
      E2E_MAILBOX_TIMEOUT_SECONDS: ${{ vars.E2E_MAILBOX_TIMEOUT_SECONDS || '120' }}
      E2E_MAILBOX_IMAP_USER: ${{ secrets.E2E_MAILBOX_IMAP_USER }}
      E2E_MAILBOX_IMAP_PASSWORD: ${{ secrets.E2E_MAILBOX_IMAP_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned browser harness
        run: |
          npm install --ignore-scripts --no-save --no-package-lock playwright@1.54.2 imapflow@1.6.6
          case "$BROWSER" in
            chrome) ./node_modules/.bin/playwright install --with-deps chrome ;;
            edge) ./node_modules/.bin/playwright install --with-deps msedge ;;
            firefox) ./node_modules/.bin/playwright install --with-deps firefox ;;
            webkit) ./node_modules/.bin/playwright install --with-deps webkit ;;
          esac
      - name: Verify persistence, PWA and authentication behavior
        run: |
          mkdir -p build/release/browser-evidence
          node tool/release/verify_web_runtime.mjs \
            "$TARGET_URL" "$BROWSER" "$EVIDENCE_PATH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-acceptance-${{ matrix.browser }}
          path: build/release/browser-evidence/${{ matrix.browser }}.json
          if-no-files-found: error
          retention-days: 30
