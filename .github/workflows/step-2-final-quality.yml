name: Step 2 final client quality
on:
  pull_request:
    paths:
      - .github/workflows/step-2-final-quality.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/step-1-authoritative-sync'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Remove redundant test import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/features/ai_integration/server_ai_workspace_controller_test.dart')
          s=p.read_text();line="import 'dart:typed_data';\n"
          assert s.count(line)==1
          p.write_text(s.replace(line,''))
          PY
          git rm .github/workflows/step-2-final-quality.yml
          git add test/features/ai_integration/server_ai_workspace_controller_test.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(step2): remove redundant widget evidence import'
          git push origin HEAD:fix/step-1-authoritative-sync
          git rev-parse HEAD > /tmp/SOURCE_COMMIT.txt
          git archive --format=tar.gz HEAD > /tmp/step2-client-quality-source.tar.gz
      - name: Install pinned Flutter
        run: |
          bash tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Structural and generated-contract gates
        run: node tool/verify_structure.mjs > /tmp/step2-client-quality-structure.txt 2>&1
      - name: Full test suite
        if: always()
        run: flutter test --reporter json > /tmp/step2-client-quality-tests.jsonl 2>&1
      - name: Strict static analysis
        if: always()
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings > /tmp/step2-client-quality-analysis.txt 2>&1
      - name: Preserve exact source and actual results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: step2-client-quality
          path: |
            /tmp/SOURCE_COMMIT.txt
            /tmp/step2-client-quality-source.tar.gz
            /tmp/step2-client-quality-structure.txt
            /tmp/step2-client-quality-tests.jsonl
            /tmp/step2-client-quality-analysis.txt
          retention-days: 14
