name: One-time SOLID formatting

on:
  push:
    branches:
      - agent/phase-4-solid-hardening

permissions:
  contents: write

concurrency:
  group: one-time-solid-formatting
  cancel-in-progress: true

jobs:
  format:
    name: Apply canonical Dart formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/phase-4-solid-hardening

      - name: Install pinned Flutter SDK
        run: |
          tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned application dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format and verify mutation scope
        id: formatting
        shell: bash
        run: |
          dart format lib test
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //')
          allowed=(
            lib/app/app_controller.dart
            lib/core/database/drift_local_sync_repository.dart
            lib/core/synchronization/generated_sync_gateway.dart
            lib/core/synchronization/sync_ports.dart
            test/architecture/layer_boundaries_test.dart
            test/core/database/drift_local_sync_repository_test.dart
            test/core/networking/api_client_factory_test.dart
            test/core/networking/generated_api_connectivity_probe_test.dart
            test/core/synchronization/generated_sync_gateway_test.dart
            test/core/synchronization/multi_device_synchronization_test.dart
            test/core/synchronization/sync_coordinator_test.dart
            test/core/synchronization/sync_models_test.dart
            test/core/synchronization/sync_ports_test.dart
            test/features/feature_registry_test.dart
          )
          for path in "${changed[@]}"; do
            permitted=false
            for candidate in "${allowed[@]}"; do
              if [[ "$path" == "$candidate" ]]; then
                permitted=true
                break
              fi
            done
            if [[ "$permitted" != true ]]; then
              echo "Unexpected formatted path: $path" >&2
              exit 1
            fi
          done
          if (( ${#changed[@]} == 0 )); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit formatting
        if: steps.formatting.outputs.changed == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- lib test
          git commit -m "Apply canonical Dart formatting"
          git push
