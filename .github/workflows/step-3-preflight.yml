name: Step 3 source preflight
on:
  pull_request:
    paths:
      - 'tool/step3-*'
      - '.github/workflows/step-3-preflight.yml'
permissions:
  contents: read
concurrency:
  group: step3-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: python3 tool/step3-prepare.py
      - name: Install the existing pinned SDK
        run: |
          bash tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Apply standard formatting
        run: dart format lib test contracts/generated/providentia_api_client/lib
      - name: Analyze actual proposed source
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings
      - name: Full unit/widget/authentication suite
        if: success() || failure()
        run: flutter test --no-pub --reporter expanded > /tmp/step3-tests.log 2>&1
      - name: Retain exact source even when validation finds defects
        if: always()
        run: |
          mkdir -p /tmp/step3-evidence
          git add -N lib test contracts ios macos tool .github
          git diff --binary HEAD -- . ':!tool/step3-*' ':!.github/workflows/step-3-preflight.yml' > /tmp/step3-evidence/reviewed-source.patch
          test -s /tmp/step3-evidence/reviewed-source.patch
          sha256sum /tmp/step3-evidence/reviewed-source.patch > /tmp/step3-evidence/source-sha256.txt
          { git rev-parse HEAD; flutter --version; } > /tmp/step3-evidence/runtime.txt
          if test -f /tmp/step3-tests.log; then cp /tmp/step3-tests.log /tmp/step3-evidence/; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: step3-client-preflight
          path: /tmp/step3-evidence/
          retention-days: 7
  materialize:
    needs: client
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download source patch from this exact run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name step3-client-preflight --dir "$RUNNER_TEMP/step3-source"
      - name: Commit only source to the existing draft repair branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/fix/step-1-authoritative-sync --jq .object.sha)" = "$EXPECTED_HEAD"
          test -s "$RUNNER_TEMP/step3-source/reviewed-source.patch"
          git apply --check "$RUNNER_TEMP/step3-source/reviewed-source.patch"
          git apply "$RUNNER_TEMP/step3-source/reviewed-source.patch"
          rm -f tool/step3-prepare.py tool/step3-preflight.patch.gz.part* .github/workflows/step-3-preflight.yml
          git config user.name 'Providentia source preparation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(step3): wire evidence review, durable intake and private export retrieval'
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git push origin HEAD:refs/heads/fix/step-1-authoritative-sync
          git config --local --unset-all http.https://github.com/.extraheader
          git rev-parse HEAD
