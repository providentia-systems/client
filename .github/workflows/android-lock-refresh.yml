name: Temporary Android dependency lock refresh

on:
  push:
    branches:
      - agent/production-readiness-phases-9-10

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Flutter SDK
        run: |
          tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve Dart dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate Gradle dependency locks
        working-directory: android
        run: ./gradlew :generateLockfiles
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-dependency-locks
          path: android/*lockfile
          if-no-files-found: error
          retention-days: 1
