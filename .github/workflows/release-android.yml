name: Release Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version without a v prefix
        required: true
        type: string
      publish:
        description: Enforce protected publication credentials
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    environment: production-release
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      version: ${{ steps.gate.outputs.version }}
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      CERT_SHA256: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}
      API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
      HOMEOWNER_APP_LINK_BASE: ${{ vars.PRODUCTION_HOMEOWNER_APP_LINK_BASE }}
    steps:
      - id: gate
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then version=$REQUESTED_VERSION; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid release version.' >&2; exit 64; }
          [[ "$API_BASE_URL" == https://* ]] || missing="${missing:-} PRODUCTION_API_BASE_URL"
          node -e '
            const uri = new URL(process.argv[1]);
            if (uri.protocol !== "https:" || uri.username !== "" || uri.password !== ""
                || uri.pathname !== "/homeowner" || uri.search !== "" || uri.hash !== "") process.exit(1);
          ' "$HOMEOWNER_APP_LINK_BASE" || missing="${missing:-} PRODUCTION_HOMEOWNER_APP_LINK_BASE"
          for pair in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
            [[ -n "${!pair}" ]] || missing="${missing:-} ${pair}"
          done
          publish=$([[ "$GITHUB_EVENT_NAME" == push || "$REQUESTED_PUBLISH" == true ]] && echo true || echo false)
          if [[ -n "${missing:-}" ]]; then
            echo "Android signing is unavailable; missing protected configuration:${missing}" >> "$GITHUB_STEP_SUMMARY"
            [[ "$publish" == false ]] || exit 78
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  signed-build:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    environment: production-release
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}
      HOMEOWNER_APP_LINK_BASE: ${{ vars.PRODUCTION_HOMEOWNER_APP_LINK_BASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Flutter
        run: |
          tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore protected Android upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/providentia-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/providentia-upload.jks" >> "$GITHUB_ENV"
      - name: Build release AAB and test APK
        run: |
          flutter pub get --enforce-lockfile
          flutter build appbundle --release \
            --build-name "$RELEASE_VERSION" --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define PROVIDENTIA_ENVIRONMENT=production \
            --dart-define PROVIDENTIA_API_BASE_URL='${{ vars.PRODUCTION_API_BASE_URL }}' \
            --dart-define PROVIDENTIA_HOMEOWNER_APP_LINK_BASE="$HOMEOWNER_APP_LINK_BASE"
          flutter build apk --release \
            --build-name "$RELEASE_VERSION" --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define PROVIDENTIA_ENVIRONMENT=production \
            --dart-define PROVIDENTIA_API_BASE_URL='${{ vars.PRODUCTION_API_BASE_URL }}' \
            --dart-define PROVIDENTIA_HOMEOWNER_APP_LINK_BASE="$HOMEOWNER_APP_LINK_BASE"
      - name: Apply and verify protected signing identity
        run: |
          bash tool/release/sign_android.sh \
            build/app/outputs/bundle/release/app-release.aab \
            build/app/outputs/flutter-apk/app-release.apk \
            build/release/android/artifacts
      - name: Generate SBOM, checksums and provenance
        run: |
          dart pub deps --json > "$RUNNER_TEMP/dart-dependencies.json"
          node tool/release/generate_release_evidence.mjs \
            --artifacts build/release/android/artifacts \
            --output build/release/android/evidence \
            --platform android --version "$RELEASE_VERSION" \
            --dependencies "$RUNNER_TEMP/dart-dependencies.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: providentia-android-${{ needs.preflight.outputs.version }}-signed
          path: build/release/android
          if-no-files-found: error
          retention-days: 30

  skipped:
    needs: preflight
    if: needs.preflight.outputs.ready != 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Android publication was explicitly skipped because protected signing configuration was absent.' >> "$GITHUB_STEP_SUMMARY"
