name: Complete report and contract archive repair
on:
  push:
    branches: [fix/step-1-authoritative-sync]
    paths: [.github/workflows/finish-report-validation.yml]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Apply tested report repair and restore the exact paired archive
        run: |
          set -euo pipefail
          sed -n 's/^          PATCH_GZIP: //p' .github/workflows/finish-report-instants.yml | base64 -d | gzip -d > "$RUNNER_TEMP/repair.patch"
          printf '%s  %s\n' 2326da7bcb2b1e3bf7474ae52e26f69d507d6b36edaee49d1da44f33eff14c37 "$RUNNER_TEMP/repair.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/repair.patch"
          git apply "$RUNNER_TEMP/repair.patch"
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib
          data = Path('contracts/providentia-v1.json').read_bytes()
          assert hashlib.sha256(data).hexdigest() == 'f6591ae866efbcc9e661528c7f595da0d7093d959d64c66c09b0c5be1dcb7c58'
          archive = bytearray(gzip.compress(data, compresslevel=9, mtime=0))
          archive[9] = 255
          assert hashlib.sha256(archive).hexdigest() == '9550a7278a8231eb7b90ca338e8b157d2e63058dafbc1bc9b05c1e553d82af11'
          Path('contracts/source/providentia-v1.json.gz').write_bytes(archive)
          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          old = '          node tool/verify_toolchain.mjs\n'
          assert s.count(old) == 1
          p.write_text(s.replace(old, old + '          bash tool/materialize-openapi-contract.sh\n'))
          PY
          bash tool/materialize-openapi-contract.sh
          node tool/generate_api_client.mjs --check
      - name: Install pinned Flutter
        run: |
          bash tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"
      - name: Run full quality gates and all three timestamp zones
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub --fatal-infos --fatal-warnings
          flutter test --no-pub --coverage
          node tool/check_coverage.mjs
          for zone in UTC Africa/Windhoek America/New_York; do
            TZ="$zone" flutter test --no-pub test/features/reporting/generated_household_report_repository_test.dart
          done
      - name: Commit actual source and remove one-time repair transport
        run: |
          set -euo pipefail
          rm .github/workflows/finish-report-instants.yml .github/workflows/finish-report-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/reporting/infrastructure/generated_household_report_repository.dart test/features/reporting/generated_household_report_repository_test.dart contracts/source/providentia-v1.json.gz docs/rep-01-report-instants.md .github/workflows/ci.yml .github/workflows/finish-report-instants.yml .github/workflows/finish-report-validation.yml
          git diff --cached --check
          git commit -m 'fix(reporting): preserve UTC instants and restore the paired canonical archive'
          git push origin HEAD:refs/heads/fix/step-1-authoritative-sync
          git rev-parse HEAD
