name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
      - 'task/**'
      - 'feature/**'
      - 'phase-*/**'
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify source-only gates
        run: |
          node tool/verify_toolchain.mjs
          node tool/generate_api_client.mjs --check
          node tool/verify_structure.mjs
          node --test tool/*.test.mjs

      - name: Install pinned Flutter SDK
        run: |
          tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned application dependencies
        run: |
          test -f pubspec.lock
          flutter pub get --enforce-lockfile

      - name: Verify generated API client formatting
        run: |
          client='contracts/generated/providentia_api_client/lib/providentia_api_client.dart'
          if ! dart format --output=none --set-exit-if-changed "$client"; then
            dart format --output=show "$client"
            exit 1
          fi

      - name: Verify generated Drift sources
        run: |
          dart run build_runner build --delete-conflicting-outputs
          test -z "$(git status --porcelain -- \
            lib/core/database/app_database.g.dart)"

      - name: Verify exported Drift schema
        run: |
          dart run drift_dev schema dump \
            lib/core/database/app_database.dart drift_schemas/
          test -z "$(git status --porcelain -- drift_schemas/)"

      - name: Verify web database worker and WASM
        run: |
          dart compile js -O4 \
            -o web/drift_worker.dart.js web/drift_worker.dart
          rm -f \
            web/drift_worker.dart.js.deps \
            web/drift_worker.dart.js.map
          test -z "$(git status --porcelain -- web/drift_worker.dart.js)"
          echo \
            '41cf968998241465d8b1dfffb1eb60dd10c35de5022a3647e14174ea3af84143  web/sqlite3.wasm' \
            | sha256sum --check --strict

      - name: Verify formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --coverage

      - name: Enforce handwritten production coverage
        run: node tool/check_coverage.mjs coverage/lcov.info 80

      - name: Produce dependency inventory
        run: |
          mkdir -p build/compliance
          dart pub deps --json > build/compliance/dart-dependencies.json

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flutter-quality-evidence
          path: |
            coverage/lcov.info
            build/compliance/dart-dependencies.json
          if-no-files-found: error
          retention-days: 14

  platform-builds:
    name: Build ${{ matrix.target }}
    needs: quality
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-24.04
            installer: linux
            command: flutter build apk --debug
            artifact: build/app/outputs/flutter-apk/app-debug.apk
          - target: web
            os: ubuntu-24.04
            installer: linux
            command: flutter build web --release
            artifact: build/web
          - target: linux
            os: ubuntu-24.04
            installer: linux
            command: flutter build linux --release
            artifact: build/linux/x64/release/bundle
          - target: windows
            os: windows-2025
            installer: windows
            command: flutter build windows --release
            artifact: build/windows/x64/runner/Release
          - target: macos
            os: macos-15
            installer: macos
            command: flutter build macos --release
            artifact: build/macos/Build/Products/Release/Providentia.app
          - target: ios
            os: macos-15
            installer: macos
            command: flutter build ios --release --no-codesign
            artifact: build/ios/iphoneos/Runner.app
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Linux prerequisites
        if: matrix.target == 'linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          clang cmake ninja-build pkg-config desktop-file-utils libgtk-3-dev liblzma-dev
          libsecret-1-dev libgstreamer1.0-dev
          libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good

      - name: Install pinned Flutter SDK on Linux
        if: matrix.installer == 'linux'
        run: |
          tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"

      - name: Install pinned Flutter SDK on Windows
        if: matrix.installer == 'windows'
        shell: pwsh
        run: |
          ./tool/install_flutter_windows.ps1 -InstallParent "$env:RUNNER_TEMP/providentia-sdk"
          "$env:RUNNER_TEMP/providentia-sdk/flutter/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install pinned Flutter SDK on macOS
        if: matrix.installer == 'macos'
        run: |
          tool/install_flutter_macos.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build target
        run: ${{ matrix.command }}

      - name: Package Linux Debian proof
        if: matrix.target == 'linux'
        run: |
          PROVIDENTIA_LINUX_PACKAGE_FORMATS=deb \
            bash tool/release/package_linux.sh \
              build/linux/x64/release/bundle \
              "0.0.0+$GITHUB_RUN_NUMBER" \
              build/release/linux/pr
          bash tool/release/verify_linux_deb.sh \
            build/release/linux/pr/providentia_0.0.0_amd64.deb

      - name: Verify Linux package on a clean Ubuntu host
        if: matrix.target == 'linux'
        run: |
          docker run --rm \
            --volume "$PWD/build/release/linux/pr:/artifacts:ro" \
            --volume "$PWD:/source:ro" \
            ubuntu:24.04 \
            bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                /artifacts/providentia_0.0.0_amd64.deb xvfb
              PROVIDENTIA_LINUX_LAUNCH_SMOKE=true \
                bash /source/tool/release/verify_linux_deb.sh \
                  /artifacts/providentia_0.0.0_amd64.deb
            '

      - name: Upload non-production build proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: providentia-${{ matrix.target }}-build-proof
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned Linux package proof
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: providentia-linux-debian-package-proof
          path: build/release/linux/pr/providentia_0.0.0_amd64.deb
          if-no-files-found: error
          retention-days: 7
