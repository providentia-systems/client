name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/phase-1-production-foundations
      - 'feature/**'
      - 'phase-*/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify source-only gates
        run: |
          node tool/verify_toolchain.mjs
          node tool/generate_api_client.mjs --check
          node tool/verify_structure.mjs

      - name: Install pinned Flutter SDK
        run: |
          tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned application dependencies
        run: |
          test -f pubspec.lock
          flutter pub get --enforce-lockfile

      - name: Verify formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test contracts/generated/providentia_api_client/lib

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --coverage

      - name: Produce dependency inventory
        run: |
          mkdir -p build/compliance
          dart pub deps --json > build/compliance/dart-dependencies.json

      - name: Upload quality evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b5404495e92b4886f43607fa02
        with:
          name: flutter-quality-evidence
          path: |
            coverage/lcov.info
            build/compliance/dart-dependencies.json
          if-no-files-found: error
          retention-days: 14

  platform-builds:
    name: Build ${{ matrix.target }}
    needs: quality
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-24.04
            installer: linux
            command: flutter build apk --debug
            artifact: build/app/outputs/flutter-apk/app-debug.apk
          - target: web
            os: ubuntu-24.04
            installer: linux
            command: flutter build web --release
            artifact: build/web
          - target: linux
            os: ubuntu-24.04
            installer: linux
            command: flutter build linux --release
            artifact: build/linux/x64/release/bundle
          - target: windows
            os: windows-2025
            installer: windows
            command: flutter build windows --release
            artifact: build/windows/x64/runner/Release
          - target: macos
            os: macos-15
            installer: macos
            command: flutter build macos --release
            artifact: build/macos/Build/Products/Release/Providentia.app
          - target: ios
            os: macos-15
            installer: macos
            command: flutter build ios --release --no-codesign
            artifact: build/ios/iphoneos/Runner.app
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Linux prerequisites
        if: matrix.target == 'linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install pinned Flutter SDK on Linux
        if: matrix.installer == 'linux'
        run: |
          tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"

      - name: Install pinned Flutter SDK on Windows
        if: matrix.installer == 'windows'
        shell: pwsh
        run: |
          ./tool/install_flutter_windows.ps1 -InstallParent "$env:RUNNER_TEMP/providentia-sdk"
          "$env:RUNNER_TEMP/providentia-sdk/flutter/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install pinned Flutter SDK on macOS
        if: matrix.installer == 'macos'
        run: |
          tool/install_flutter_macos.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build target
        run: ${{ matrix.command }}

      - name: Upload non-production build proof
        uses: actions/upload-artifact@ea165f8d65b6e75b5404495e92b4886f43607fa02
        with:
          name: providentia-${{ matrix.target }}-build-proof
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
