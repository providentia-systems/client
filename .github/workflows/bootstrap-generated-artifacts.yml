name: Generated artifact refresh

on:
  pull_request:
    paths:
      - pubspec.lock
      - pubspec.yaml
      - lib/core/database/**
      - test/goldens/fresh_market_shell_golden_test.dart
      - lib/app/**
      - lib/core/design_system/**
      - web/drift_worker.dart
      - web/sqlite3.wasm
      - web/drift-assets.lock.json
      - .github/workflows/bootstrap-generated-artifacts.yml
  push:
    branches:
      - main
      - 'agent/**'
      - 'feature/**'
      - 'phase-*/**'
    paths:
      - pubspec.lock
      - pubspec.yaml
      - lib/core/database/**
      - test/goldens/fresh_market_shell_golden_test.dart
      - lib/app/**
      - lib/core/design_system/**
      - web/drift_worker.dart
      - web/sqlite3.wasm
      - web/drift-assets.lock.json
      - .github/workflows/bootstrap-generated-artifacts.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: providentia-flutter-generated-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh reviewable generated artifacts
    if: >-
      github.repository == 'vast-development-method/providentia-flutter' &&
      (github.event_name == 'pull_request' ||
      !contains(github.event.head_commit.message, '[generated-bootstrap]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pushed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Install pinned Flutter SDK
        run: |
          tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve only the committed dependency graph
        run: |
          test -f pubspec.lock
          flutter pub get --enforce-lockfile

      - name: Generate Drift implementation and schema
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run drift_dev schema dump \
            lib/core/database/app_database.dart drift_schemas/

      - name: Compile the web database worker
        run: |
          dart compile js -O4 \
            -o web/drift_worker.dart.js web/drift_worker.dart
          rm -f \
            web/drift_worker.dart.js.deps \
            web/drift_worker.dart.js.map

      - name: Verify the pinned WebAssembly asset
        run: |
          echo \
            '41cf968998241465d8b1dfffb1eb60dd10c35de5022a3647e14174ea3af84143  web/sqlite3.wasm' \
            | sha256sum --check --strict

      - name: Render the deterministic phone golden
        run: >-
          flutter test --update-goldens
          test/goldens/fresh_market_shell_golden_test.dart

      - name: Verify exact mutation scope
        id: mutation
        shell: bash
        run: |
          mapfile -t changed < <(git status --porcelain | sed 's/^...//')
          for path in "${changed[@]}"; do
            case "$path" in
              lib/core/database/app_database.g.dart|\
              drift_schemas/*|\
              web/drift_worker.dart.js|\
              test/goldens/providentia_fresh_market_phone.png)
                ;;
              *)
                echo "Unexpected generated path: $path" >&2
                exit 1
                ;;
            esac
          done
          if [[ ${#changed[@]} -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit only reviewable generated artifacts
        if: steps.mutation.outputs.changed == 'true'
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            lib/core/database/app_database.g.dart \
            drift_schemas \
            web/drift_worker.dart.js \
            test/goldens/providentia_fresh_market_phone.png
          mapfile -t staged < <(git diff --cached --name-only)
          for path in "${staged[@]}"; do
            case "$path" in
              lib/core/database/app_database.g.dart|\
              drift_schemas/*|\
              web/drift_worker.dart.js|\
              test/goldens/providentia_fresh_market_phone.png)
                ;;
              *)
                echo "Unexpected staged path: $path" >&2
                exit 1
                ;;
            esac
          done
          git commit -m \
            '[generated-bootstrap] Refresh Drift, worker, and golden artifacts'
          git push origin "HEAD:${TARGET_BRANCH}"
