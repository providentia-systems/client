name: Household client final validation

on:
  push:
    branches: [fix/client-household-workflows]
    paths: [.github/workflows/household-client-validation.yml]

permissions:
  contents: write

concurrency:
  group: household-client-repair
  cancel-in-progress: false

jobs:
  finalize-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/client-household-workflows
          path: client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: providentia-systems/backend
          ref: 6a66c2d5c4273dd41c8cea65c1bb1165337915f9
          path: backend
          persist-credentials: false
      - name: Finalize refresh safety, documentation and temporary-file cleanup
        run: |
          mkdir -p /tmp/household-client-evidence
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path.cwd()
          path = root / 'lib/features/inventory/infrastructure/item_master_refreshing_synchronization.dart'
          source = path.read_text()
          start = source.index('  SyncRunOutcome _staleCatalog(')
          end = source.index('\n  void _requireBoundHome', start)
          method = """  SyncRunOutcome _staleCatalog(SyncRunOutcome outcome) => SyncRunOutcome(
            status: outcome.status == SyncRunStatus.uploadsBlocked ||
                    outcome.status == SyncRunStatus.uploadsPending
                ? outcome.status
                : SyncRunStatus.retryableFailure,
            acknowledgedCount: outcome.acknowledgedCount,
            pulledChangeCount: outcome.pulledChangeCount,
            pullCompleted: outcome.pullCompleted,
            remainingUploads: outcome.remainingUploads,
            safeMessage: outcome.completed
                ? 'Home changes synchronized, but the catalog could not be refreshed. The last verified catalog is shown; retry synchronization.'
                : 'The catalog could not be refreshed. Queued or blocked uploads remain unresolved; the last verified catalog is shown.',
          );
          """
          path.write_text(source[:start] + method + source[end:])
          path = root / 'test/features/inventory/category_refresh_safety_test.dart'
          path.write_text(path.read_text().replace('const ConnectivityResult(availability: SyncAvailability.online)', 'const ConnectivityResult.online()'))
          for name in ('README.md', 'docs/contracts.md', 'docs/local-development.md', 'docs/platform-access.md', 'docs/server-ai-integration.md', 'docs/reporting-data-governance-integration.md', 'docs/rep-01-report-instants.md'):
              path = root / name
              path.write_text(path.read_text().replace('2.1.0', '2.2.0'))
          path = root / 'docs/product-lifecycle-integration.md'
          source = path.read_text().replace('API 2.1.0', 'API 2.2.0')
          source = source.replace('The product name is Providentia.', 'The product name is Providentia. The PR references above describe the original lifecycle baseline. Current household product editing, unit semantics and global-category selection are documented in [Household workflows](household-workflows.md).', 1)
          source = source.replace('| Private products | Client and Admin create/edit/archive/restore; editable private name, pack description and home category; revisions prevent stale overwrites. |', '| Private products | Client and Admin retain create/edit/archive/restore. The household Client additionally edits linked-product household overrides, stock-unit labels and published global/local category selections. Revisions prevent stale overwrites; quantity/history are retained. |')
          path.write_text(source)
          path = root / 'docs/architecture.md'
          source = path.read_text().replace('and treats HTTP 403/404 as authorization loss.', 'and treats only explicit backend home-access denial as revoked membership. Generic HTTP 403/404 and public category endpoint failures preserve saved work.')
          path.write_text(source + '\nCurrent household metadata projection, category-cache and unit-label boundaries are documented in [Household workflows](household-workflows.md).\n')
          guide = (root.parent / 'backend/docs/household-workflows.md').read_text()
          (root / 'docs/household-workflows.md').write_text('\n'.join(line.lstrip() for line in guide.splitlines()) + '\n')
          path = root / 'README.md'
          path.write_text(path.read_text() + '\nHousehold product editing, global/local category selection, adjustment reasons and upgrade requirements: [Household workflows](docs/household-workflows.md).\n')
          path = root / 'docs/handover-sync-health.md'
          path.write_text(path.read_text() + '\nThe later API 2.2.0 household feature completion is documented in [Household workflows](household-workflows.md). Category-refresh failures retain completed-pull evidence, pending/blocked upload status and the unresolved upload count; they never turn a blocked queue into full synchronization success.\n')
          for pattern in ('tool/client-household-*', 'tool/household-transfer-2.b64', 'tool/household-transfer-3.b64', '.github/workflows/client-workflow-repair.yml', '.github/workflows/household-client-validation.yml'):
              for path in root.glob(pattern):
                  path.unlink()
          assert hashlib.sha256((root / 'contracts/providentia-v1.json').read_bytes()).hexdigest() == 'ef5714a6298326d6fb449b966117e8b61c74de67d1bfc274ad8ec431aecd802d'
          PY
      - name: Install pinned Flutter and resolve the unchanged dependency lock
        run: |
          tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/providentia-sdk/flutter/bin:$PATH"
          flutter pub get --enforce-lockfile
      - name: Format source and run source-only gates
        run: |
          dart format lib test contracts/generated/providentia_api_client/lib
          git diff --check
          node tool/verify_toolchain.mjs
          bash tool/materialize-openapi-contract.sh
          node tool/generate_api_client.mjs --check
          node tool/verify_structure.mjs
          node --test tool/*.test.mjs
      - name: Strict analysis and the complete unchanged Flutter coverage gate
        run: |
          flutter analyze --fatal-infos --fatal-warnings 2>&1 | tee /tmp/household-client-evidence/analyze.log
          flutter test --coverage --reporter expanded 2>&1 | tee /tmp/household-client-evidence/tests.log
          node tool/check_coverage.mjs coverage/lcov.info 80 2>&1 | tee /tmp/household-client-evidence/coverage.log
      - name: Commit only verified source, documentation and temporary cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lib test contracts docs README.md
          git add -u -- tool .github/workflows
          git commit -m 'fix: retain upload barriers and finalize household workflow documentation'
          git push origin HEAD:fix/client-household-workflows
      - name: Export exact source and validation evidence
        if: always()
        run: |
          mkdir -p /tmp/household-client-evidence
          git rev-parse HEAD > /tmp/household-client-evidence/commit.txt
          git archive --format=tar HEAD > /tmp/household-client-evidence/client.tar
          git diff > /tmp/household-client-evidence/uncommitted.patch
          if test -f coverage/lcov.info; then cp coverage/lcov.info /tmp/household-client-evidence/; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: household-client-source-evidence
          path: /tmp/household-client-evidence/
          retention-days: 2
