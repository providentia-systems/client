name: Step 3 lifecycle and coverage validation
on:
  pull_request:
    paths: ['.github/workflows/step-3-lifecycle-check.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: |
          bash tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: |
          dart format lib test
          dart fix --apply --code=directives_ordering,curly_braces_in_flow_control_structures,unnecessary_import
          dart format lib test
      - run: flutter analyze --no-pub --fatal-infos --fatal-warnings
      - name: Full suite, including explicit save and account-bound resume persistence
        if: success() || failure()
        run: flutter test --no-pub --coverage --reporter expanded > /tmp/step3-tests.log 2>&1
      - name: Retain actual source and evidence
        if: always()
        run: |
          mkdir -p /tmp/step3-evidence
          git diff --binary HEAD -- . ':!.github/workflows/step-3-lifecycle-check.yml' > /tmp/step3-evidence/reviewed-source.patch
          { git rev-parse HEAD; flutter --version; } > /tmp/step3-evidence/runtime.txt
          cp /tmp/step3-tests.log /tmp/step3-evidence/
          if test -f coverage/lcov.info; then cp coverage/lcov.info /tmp/step3-evidence/; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: step3-client-lifecycle
          path: /tmp/step3-evidence/
          retention-days: 7
  source:
    needs: test
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name step3-client-lifecycle --dir "$RUNNER_TEMP/source"
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/fix/step-1-authoritative-sync --jq .object.sha)" = "$EXPECTED_HEAD"
          git apply --check "$RUNNER_TEMP/source/reviewed-source.patch"
          git apply "$RUNNER_TEMP/source/reviewed-source.patch"
          rm .github/workflows/step-3-lifecycle-check.yml
          git config user.name 'Providentia source preparation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(step3): validate explicit save lifecycle and account-isolated review hints'
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git push origin HEAD:refs/heads/fix/step-1-authoritative-sync
          git config --local --unset-all http.https://github.com/.extraheader
