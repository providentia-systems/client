name: Finalize report instant repair
on:
  push:
    branches: [fix/step-1-authoritative-sync]
    paths: [.github/workflows/finish-report-instants.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Apply exact locally tested source
        env:
          PATCH_GZIP: 
        run: |
          set -euo pipefail
          printf %s "$PATCH_GZIP" | base64 -d | gzip -d > "$RUNNER_TEMP/repair.patch"
          printf '%s  %s\n' 2326da7bcb2b1e3bf7474ae52e26f69d507d6b36edaee49d1da44f33eff14c37 "$RUNNER_TEMP/repair.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/repair.patch"
          git apply "$RUNNER_TEMP/repair.patch"
      - name: Install pinned Flutter
        run: |
          bash tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"
      - name: Validate source, generated artifacts and full tests
        run: |
          set -euo pipefail
          bash tool/materialize-openapi-contract.sh
          flutter pub get --enforce-lockfile
          node tool/generate_api_client.mjs
          dart run build_runner build --delete-conflicting-outputs
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub --fatal-infos --fatal-warnings
          flutter test --no-pub --coverage
          node tool/check_coverage.mjs
          for zone in UTC Africa/Windhoek America/New_York; do
            TZ="$zone" flutter test --no-pub test/features/reporting/generated_household_report_repository_test.dart
          done
      - name: Commit tested source to existing branch without rewriting history
        run: |
          set -euo pipefail
          rm .github/workflows/finish-report-instants.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/reporting/infrastructure/generated_household_report_repository.dart test/features/reporting/generated_household_report_repository_test.dart docs/rep-01-report-instants.md .github/workflows/finish-report-instants.yml
          git diff --cached --check
          git commit -m 'fix(reporting): preserve legacy SQL UTC instants across device timezones'
          git push origin HEAD:refs/heads/fix/step-1-authoritative-sync
          git rev-parse HEAD
