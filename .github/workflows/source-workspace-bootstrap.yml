name: Source workspace bootstrap

on:
  push:
    branches:
      - agent/production-readiness-phases-9-10
    paths:
      - .github/workflows/source-workspace-bootstrap.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Package source workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Upload source workspace
        uses: actions/upload-artifact@v4
        with:
          name: providentia-flutter-source
          path: .
          include-hidden-files: true
          retention-days: 1
