name: Step 2 client UI verification
on:
  pull_request:
    paths:
      - .github/workflows/step-2-ui-finish.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/step-1-authoritative-sync'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install pinned Flutter
        run: |
          bash tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Tighten source and preserve owner-only credential regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/app/production_bootstrap_app.dart');s=p.read_text();old="workspace.profile(plan.primary.profileId ?? '')";assert s.count(old)==1;p.write_text(s.replace(old,'workspace.profile(plan.primary.profileId)'))
          p=Path('test/features/ai_integration/server_ai_workspace_controller_test.dart');s=p.read_text();a=s.index("testWidgets('manager controls send exact revisioned write-only requests'");b=s.index('\n    testWidgets(',a+30);part=s[a:b].replace('manager controls send','owner controls send').replace('_controller(repository: repository)', '_controller(repository: repository, capabilities: _ownerCapabilities())');s=s[:a]+part+s[b:]
          s=s.replace("import 'dart:ui' as ui;\nimport 'dart:typed_data';", "import 'dart:typed_data';\nimport 'dart:ui' as ui;")
          s=s.replace("import 'package:flutter/rendering.dart';", "import 'package:flutter/rendering.dart';\nimport 'package:flutter/services.dart';")
          s=s.replace('void main() {', '''void main() {
            setUpAll(() async {
              final path = Platform.environment['PROVIDENTIA_UI_FONT'];
              if (path != null) {
                final loader = FontLoader('Roboto')..addFont(Future.value(
                  ByteData.sublistView(await File(path).readAsBytes()),
                ));
                await loader.load();
              }
            });
          ''',1)
          s=s.replace("await _captureStep2(tester, 'household-ai-setup-required');", "await _scrollTo(tester, const Key('ai-configuration-required'));\n        await _captureStep2(tester, 'household-ai-setup-required');")
          p.write_text(s)
          p=Path('test/integration/step_2_configuration_contract_test.dart');s=p.read_text();line="import 'package:providentia/features/ai_integration/domain/ai_transmission_plan.dart';\n";s=s.replace(line+'\n','');needle="import 'package:providentia/features/ai_integration/domain/server_ai_models.dart';";s=s.replace(needle,line+needle);p.write_text(s)
          PY
          dart format lib/app/production_bootstrap_app.dart test/features/ai_integration/server_ai_workspace_controller_test.dart test/integration/step_2_configuration_contract_test.dart
          git diff --check
          git rm .github/workflows/step-2-ui-finish.yml
          git add lib/app/production_bootstrap_app.dart test/features/ai_integration/server_ai_workspace_controller_test.dart test/integration/step_2_configuration_contract_test.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(step2): enforce shared-profile ownership and render real setup screenshots'
          git push origin HEAD:fix/step-1-authoritative-sync
          git rev-parse HEAD > /tmp/SOURCE_COMMIT.txt
          git archive --format=tar.gz HEAD > /tmp/step2-client-verified-source.tar.gz
      - name: Full Flutter regression suite
        run: flutter test --reporter json > /tmp/step2-client-verified-tests.jsonl 2>&1
      - name: Static analysis
        if: always()
        run: flutter analyze --no-pub > /tmp/step2-client-verified-analysis.txt 2>&1
      - name: Actual readable synthetic UI evidence
        if: always()
        env:
          PROVIDENTIA_UI_EVIDENCE: /tmp/step2-ui
          PROVIDENTIA_UI_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
        run: flutter test test/features/ai_integration/server_ai_workspace_controller_test.dart --plain-name 'workspace page states and actions' --reporter json > /tmp/step2-ui-tests.jsonl 2>&1
      - name: Preserve actual evidence and source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: step2-client-verified
          path: |
            /tmp/SOURCE_COMMIT.txt
            /tmp/step2-client-verified-source.tar.gz
            /tmp/step2-client-verified-tests.jsonl
            /tmp/step2-client-verified-analysis.txt
            /tmp/step2-ui-tests.jsonl
            /tmp/step2-ui
          retention-days: 14
