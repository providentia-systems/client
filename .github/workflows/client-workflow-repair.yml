name: Household workflow repair workspace

on:
  push:
    branches: [fix/client-household-workflows]
    paths: [.github/workflows/client-workflow-repair.yml, tool/household-workflow-repair.py]

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: providentia-systems/backend
          path: backend
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: providentia-systems/admin
          path: admin
      - name: Archive tracked source only
        run: |
          mkdir source-snapshot
          for repo in client backend admin; do
            git -C "$repo" rev-parse HEAD >> source-snapshot/commits.txt
            git -C "$repo" archive --format=tar HEAD > "source-snapshot/$repo.tar"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: household-workflow-source-snapshot
          path: source-snapshot/
          retention-days: 1
